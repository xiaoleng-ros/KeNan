# ============================================================
# 柯南的世界 — 1Panel / OpenResty 站点配置片段
# 用法：1Panel → 网站 → 你的站点 → 配置 → 粘贴到合适位置
# 全部内容都是「加上去更优」，不加也能跑
# ============================================================

# 1. 压缩：JSON 数据有 512KB，gzip 后能降到 ~120KB，必开
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_types        text/plain
                  text/css
                  text/xml
                  application/json
                  application/javascript
                  application/xml
                  application/xml+rss
                  image/svg+xml;

# 2. 静态资源长缓存（文件名不带 hash，所以只给图片和图标加）
#    注意：js/css 没加缓存，因为无 hash 命名，改了会不生效
location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}

# 3. JSON 数据：短缓存，平衡速度和更新
location ~* ^/data/.+\.json$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    add_header Content-Type "application/json; charset=utf-8";
    access_log off;
}

# 4. 首页禁缓存，避免改了内容看不到
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# 5. 安全响应头
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
